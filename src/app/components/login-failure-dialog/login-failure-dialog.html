<mat-dialog-content class="dialog">
    <div class="header">
        <h3>Login Failed</h3>
    </div>
    <div class="content">
        <p>The provided credentials are either invalid or do not exist.</p>
    </div>
    <mat-dialog-actions>
        <button type="button" matButton (click)="onClose()">
            <p>Close</p>
            <mat-icon>close</mat-icon>
        </button>
    </mat-dialog-actions>
</mat-dialog-content>
