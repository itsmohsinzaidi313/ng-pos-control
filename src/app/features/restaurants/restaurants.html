@if(!(restaurants$ | async)) {
<app-loading-spinner />
}
@else {
<div class="search-bar">
    <input matInput [formControl]="formControl" placeholder="Search" />
</div>
<mat-list>
    @for (restaurant of filteredItems$ | async ; track $index) {
    <div class="list-item">
        <mat-list-item matRipple class="hoverable-list-item" [routerLink]="['/branches', restaurant.UniqueId]">
            <div matListItemTitle>{{restaurant.Name}}</div>
            <div matListItemLine>Branches: {{restaurant.TotalBranches}} - Users: {{restaurant.TotalUsers}}</div>
        </mat-list-item>
    </div>
    } @empty {
    <span></span>
    }
</mat-list>
}
