<div class="login-content">
  <mat-card class="login-card">
    <mat-card-title class="title">
      <h4>LOGIN</h4>
    </mat-card-title>
    <mat-card-content class="title">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmited()">
        <mat-form-field class="input-fields">
          <mat-label>Username</mat-label>
          <input formControlName="username" matInput placeholder="Username" />
        </mat-form-field>
        <mat-form-field class="input-fields">
          <mat-label> Password </mat-label>
          <input formControlName="password" matInput type="password" placeholder="Password" />
        </mat-form-field>
        @if($loading | async) {
        <div class="login-button">
          <app-loading-spinner />
        </div>
        }
        @else {
        <div class="login-button">
          <button type="submit" matButton="filled" [disabled]="loginForm.invalid">Submit</button>
        </div>
        }
      </form>
    </mat-card-content>
  </mat-card>
</div>
