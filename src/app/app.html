<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer mode="over">
    <app-sidenav-content />
  </mat-sidenav>
  <mat-sidenav-content>
    <app-toolbar (menuClicked$)="drawer.toggle()" class="toolbar" />
    <div class="routed-content">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
